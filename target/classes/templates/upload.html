<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestor Documental - Grup Voltes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5">
  <h3 th:text="'Pujar arxiu per a: ' + ${document.documentType.name}"></h3>
  <h5 class="text-muted mb-4" th:text="${document.client.name}"></h5>

  <form th:action="@{/document/{id}/upload(id=${document.id})}" method="post" enctype="multipart/form-data" class="w-50 border p-4 rounded shadow-sm bg-light">
    <div class="mb-3">
      <label class="form-label fw-bold">Selecciona el PDF o Imatge</label>
      <input type="file" name="file" class="form-control" accept=".pdf,.png,.jpg,.jpeg" required>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a th:href="@{/client/{id}/checklist(id=${document.client.id})}" class="btn btn-secondary">Cancel·lar</a>
      <button type="submit" class="btn btn-primary">Guardar Arxiu</button>
    </div>
  </form>
</div>
</body>
</html>
