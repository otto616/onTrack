<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor Documental - Grup Voltes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5">

    <div th:if="${not #lists.isEmpty(alerts)}" class="accordion shadow-sm mb-4" id="alertAccordion">
        <div class="accordion-item border-warning">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed bg-warning text-dark fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAlerts" aria-expanded="false" aria-controls="collapseAlerts">
                    🔔 Hi ha documents caducats o a punt de caducar (Clic per obrir)
                </button>
            </h2>
            <div id="collapseAlerts" class="accordion-collapse collapse" data-bs-parent="#alertAccordion">
                <div class="accordion-body bg-light">
                    <ul class="mb-0">
                        <li th:each="alert : ${alerts}" class="mb-1">
                            <strong th:text="${alert.client.name}"></strong> -
                            <span th:text="${alert.documentType.name}"></span>
                            (Data: <span th:text="${alert.expirationDate}"></span>)
                            <span th:if="${alert.status == 'EXPIRED'}" class="badge bg-danger ms-2">Caducat</span>
                            <span th:if="${alert.status == 'EXPIRING_SOON'}" class="badge bg-warning text-dark ms-2">Caduca Aviat</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 bg-primary text-white h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="card-title">Total Clients</h5>
                    <h2 class="display-4 fw-bold mb-0" th:text="${totalClients}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 bg-warning text-dark h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="card-title">Documents Pendents Globals</h5>
                    <h2 class="display-4 fw-bold mb-0" th:text="${pendingDocs}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 bg-danger text-white h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="card-title">Documents Caducats Globals</h5>
                    <h2 class="display-4 fw-bold mb-0" th:text="${expiredDocs}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 mt-5">
        <h2>Llistat de Clients</h2>
        <div class="d-flex w-50 justify-content-end">
            <form th:action="@{/}" method="get" class="input-group me-3 w-75">
                <input type="text" class="form-control" name="search" placeholder="Cercar per nom o CIF..." th:value="${searchQuery}">
                <button class="btn btn-outline-secondary" type="submit">🔍 Cercar</button>
                <a th:if="${searchQuery != null and !searchQuery.isEmpty()}" th:href="@{/}" class="btn btn-outline-danger">✖</a>
            </form>
            <a th:href="@{/catalog}" class="btn btn-outline-primary me-2 text-nowrap">⚙️ Catàleg</a>
            <a th:href="@{/client/new}" class="btn btn-success text-nowrap">+ Nou Client</a>
        </div>
    </div>

    <table class="table table-striped table-hover table-bordered align-middle shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Empresa</th>
            <th>NIF / CIF</th>
            <th>Tipologia</th>
            <th class="text-center">Estat Documents</th>
            <th>Accions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.id}"></td>
            <td th:text="${client.name}" class="fw-bold"></td>
            <td th:text="${client.taxId}"></td>
            <td th:text="${client.clientType.description}"></td>
            <td class="text-center">
                        <span class="badge bg-warning text-dark me-1" title="Pendents d'entregar">
                            <span th:text="${pendingMap.get(client.id)}"></span> Pen.
                        </span>
                <span class="badge bg-danger" title="Caducats">
                            <span th:text="${expiredMap.get(client.id)}"></span> Cad.
                        </span>
                <span th:if="${pendingMap.get(client.id) == 0 and expiredMap.get(client.id) == 0}" class="badge bg-success ms-1">
                            Tot OK
                        </span>
            </td>
            <td>
                <a th:href="@{/client/{id}/checklist(id=${client.id})}" class="btn btn-sm btn-primary">Veure Checklist</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
