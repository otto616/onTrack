<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestor Documental - Grup Voltes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5">
  <a href="/" class="btn btn-outline-secondary mb-3">&larr; Tornar a l'inici</a>

  <h2 class="mb-4">Afegir Nou Client</h2>

  <form th:action="@{/client/new}" th:object="${client}" method="post" class="w-50">
    <div class="mb-3">
      <label class="form-label">Nom de l'Empresa</label>
      <input type="text" class="form-control" th:field="*{name}" required />
    </div>

    <div class="mb-3">
      <label class="form-label">NIF / CIF</label>
      <input type="text" class="form-control" th:field="*{taxId}" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Tipologia</label>
      <select class="form-select" th:field="*{clientType}" required>
        <option value="" disabled selected>Selecciona un tipus...</option>
        <option th:each="type : ${clientTypes}"
                th:value="${type}"
                th:text="${type.description}"></option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Crear Client</button>
  </form>
</div>
</body>
</html>
