<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestor Documental - Grup Voltes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5 mb-5">
  <a href="/" class="btn btn-outline-secondary mb-3">&larr; Tornar a l'inici</a>

  <h2 class="mb-4">Catàleg Mestre de Documents</h2>

  <div class="card mb-5 shadow-sm">
    <div class="card-header bg-light fw-bold">Afegir Nou Tipus de Document</div>
    <div class="card-body">
      <form th:action="@{/catalog/new}" th:object="${newDocument}" method="post" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nom del Document</label>
          <input type="text" class="form-control" th:field="*{name}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Categoria</label>
          <select class="form-select" th:field="*{category}" required>
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.description}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipologia de Client</label>
          <select class="form-select" th:field="*{clientType}" required>
            <option th:each="type : ${clientTypes}" th:value="${type}" th:text="${type.description}"></option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <div class="form-check mb-2 border p-2 rounded w-100 bg-light">
            <input class="form-check-input ms-1" type="checkbox" th:field="*{expires}" id="expiresCheck">
            <label class="form-check-label ms-2" for="expiresCheck">Té caducitat?</label>
          </div>
        </div>
        <div class="col-12 text-end mt-4">
          <button type="submit" class="btn btn-success">Afegir al Catàleg</button>
        </div>
      </form>
    </div>
  </div>

  <h4 class="mb-3">Documents Configurats</h4>
  <table class="table table-striped table-hover table-bordered align-middle">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nom del Document</th>
      <th>Categoria</th>
      <th>Tipologia Assignada</th>
      <th class="text-center">Caduca?</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doc : ${documents}">
      <td th:text="${doc.id}"></td>
      <td th:text="${doc.name}"></td>
      <td th:text="${doc.category.description}"></td>
      <td th:text="${doc.clientType.description}"></td>
      <td class="text-center">
        <span th:if="${doc.expires}" class="badge bg-warning text-dark">Sí</span>
        <span th:unless="${doc.expires}" class="badge bg-secondary">No</span>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
