<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maquinària · Gestor Documental</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="appbar">
    <div class="appbar__inner">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark">GV</span>
            <span class="brand__text"><strong>Gestor</strong><span>Documental</span></span>
        </a>
    </div>
</header>
<main class="shell shell--narrow">
    <a th:href="@{/provider/{id}/machinery(id=${provider.id})}" class="backlink">&larr; Torna a la maquinària</a>
    <div class="pagehead">
        <div>
            <span class="eyebrow" th:text="${provider.name}">Proveïdor</span>
            <h1 class="pagehead__title" th:text="${machinery.id != null ? 'Edita màquina' : 'Nova màquina'}">Màquina</h1>
        </div>
    </div>
    <div class="panel">
        <div class="panel__head">
            <div class="panel__title">Dades i documentació tècnica</div>
        </div>
        <form th:action="${machinery.id != null ? '/provider/' + provider.id + '/machinery/' + machinery.id + '/edit' : '/provider/' + provider.id + '/machinery/new'}" th:object="${machinery}" method="post" class="panel__body">
            <div class="field">
                <label class="field__label">Descripció o Model</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="formgrid">
                <div class="field col-6">
                    <label class="field__label">Codi Intern</label>
                    <input type="text" th:field="*{internalCode}" class="form-control">
                </div>
                <div class="field col-6">
                    <label class="field__label">Número de Sèrie / Bastidor</label>
                    <input type="text" th:field="*{serialNumber}" class="form-control" required>
                </div>
            </div>
            <div class="form-actions">
                <a th:href="@{/provider/{id}/machinery(id=${provider.id})}" class="btn btn--quiet">Cancel·la</a>
                <button type="submit" class="btn btn--ink">Desa la màquina</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
