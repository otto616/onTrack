<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestor Documental - Grup Voltes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5 mb-5">
  <a href="/" class="btn btn-outline-secondary mb-3">&larr; Tornar a l'inici</a>

  <h2 class="mb-1" th:text="${client.name}"></h2>
  <h5 class="text-muted mb-4" th:text="${client.clientType.description}"></h5>

  <form th:action="@{/client/{id}/checklist(id=${client.id})}" th:object="${form}" method="post">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>Categoria</th>
        <th>Document</th>
        <th class="text-center">Arxiu</th>
        <th class="text-center">Rebut (OK)</th>
        <th>Data Caducitat</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="doc, stat : *{documents}"
          th:classappend="${doc.status == 'EXPIRED' ? 'table-danger' : (doc.status == 'EXPIRING_SOON' ? 'table-warning' : '')}">

        <input type="hidden" th:field="*{documents[__${stat.index}__].id}" />

        <td th:text="${doc.documentType.category.description}"></td>
        <td th:text="${doc.documentType.name}"></td>

        <td class="text-center">
          <a th:if="${doc.fileName == null}" th:href="@{/document/{id}/upload(id=${doc.id})}" class="btn btn-sm btn-outline-primary">Pujar PDF</a>
          <div th:if="${doc.fileName != null}">
            <a th:href="@{/document/{id}/download(id=${doc.id})}" class="btn btn-sm btn-info text-white">Veure PDF</a>
          </div>
        </td>

        <td class="text-center">
          <input class="form-check-input" type="checkbox" th:field="*{documents[__${stat.index}__].received}" />
        </td>

        <td>
          <input class="form-control form-control-sm" type="date"
                 th:field="*{documents[__${stat.index}__].expirationDate}"
                 th:disabled="${!doc.documentType.expires}" />

          <div class="mt-1" th:if="${doc.status == 'EXPIRED'}">
            <span class="badge bg-danger">Caducat!</span>
          </div>
          <div class="mt-1" th:if="${doc.status == 'EXPIRING_SOON'}">
            <span class="badge bg-warning text-dark">Caduca en < 30 dies</span>
          </div>
        </td>
      </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-end mt-3">
      <button type="submit" class="btn btn-success">Guardar Canvis de Dates</button>
    </div>
  </form>
</div>
</body>
</html>
