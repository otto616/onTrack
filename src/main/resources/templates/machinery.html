<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maquinària · Gestor Documental</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="appbar">
    <div class="appbar__inner">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark">GV</span>
            <span class="brand__text"><strong>Gestor</strong><span>Documental</span></span>
        </a>
        <nav class="appnav">
            <a th:href="@{/}" class="appnav__link is-active">Proveïdors</a>
            <a th:href="@{/catalog}" class="appnav__link">Catàleg</a>
        </nav>
    </div>
</header>
<main class="shell">
    <a th:href="@{/}" class="backlink">&larr; Tots els proveïdors</a>
    <div class="pagehead">
        <div>
            <span class="eyebrow">Equip del proveïdor</span>
            <h1 class="pagehead__title" th:text="${provider.name}">Nom del proveïdor</h1>
            <p class="pagehead__sub">Llistat de maquinària registrada.</p>
        </div>
        <div class="pagehead__actions">
            <a th:href="@{/provider/{id}/machinery/new(id=${provider.id})}" class="btn btn--ink">+ Nova màquina</a>
        </div>
    </div>
    <div class="table-wrap">
        <div class="table-scroll">
            <table class="table-x">
                <thead>
                <tr>
                    <th>Descripció / Model</th>
                    <th>Codi Intern</th>
                    <th>Número de sèrie / Bastidor</th>
                    <th class="t-right">Accions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="machinery : ${machineries}" class="row-spine"
                    th:onclick="|window.location.href='@{/provider/{pid}/machinery/{mid}/checklist(pid=${provider.id}, mid=${machinery.id})}'|"
                    style="cursor: pointer;">

                    <td class="cell-name" th:text="${machinery.name}">—</td>
                    <td class="cell-mono" th:text="${machinery.internalCode}">—</td>
                    <td class="cell-mono" th:text="${machinery.serialNumber}">—</td>
                    <td class="t-right">
                        <a th:href="@{/provider/{pid}/machinery/{mid}/edit(pid=${provider.id}, mid=${machinery.id})}"
                           class="btn btn--line btn--sm"
                           onclick="event.stopPropagation();">Edita</a>

                        <a th:href="@{/provider/{pid}/machinery/{mid}/delete(pid=${provider.id}, mid=${machinery.id})}"
                           class="btn btn--quiet btn--sm"
                           onclick="event.stopPropagation(); return confirm('Segur que vols eliminar aquesta màquina?');">Esborra</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(machineries)}">
                    <td colspan="4">
                        <div class="empty">
                            <p class="empty__title">Cap màquina registrada</p>
                            <a th:href="@{/provider/{id}/machinery/new(id=${provider.id})}" class="btn btn--line">+ Afegeix-ne una</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
