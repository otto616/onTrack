<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expedient Màquina</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="appbar">
    <div class="appbar__inner">
        <a class="brand" th:href="@{/}"><span class="brand__mark">GV</span><span class="brand__text"><strong>Gestor</strong><span>Documental</span></span></a>
    </div>
</header>
<main class="shell">
    <!--/*@thymesVar id="form" type="com.otto616.onTrack.dto.ChecklistForm"*/-->
    <!--/*@thymesVar id="machinery" type="com.otto616.onTrack.models.Machinery"*/-->
    <!--/*@thymesVar id="provider" type="com.otto616.onTrack.models.Provider"*/-->
    <a th:href="@{/provider/{id}/machinery(id=${provider.id})}" class="backlink">&larr; Torna a la maquinària</a>
    <div class="pagehead">
        <div>
            <span class="eyebrow" th:text="${provider.name}">Empresa</span>
            <h1 class="pagehead__title" th:text="${machinery.name}">Nom de la Màquina</h1>
            <p class="pagehead__sub">Codi: <span th:text="${machinery.internalCode}"></span> | S/N: <span th:text="${machinery.serialNumber}"></span></p>
        </div>
    </div>
    <form th:action="@{/provider/{pid}/machinery/{mid}/checklist(pid=${provider.id}, mid=${machinery.id})}" th:object="${form}" method="post">
        <div class="table-wrap">
            <div class="panel__head">
                <div class="panel__title">Control de Documentació</div>
            </div>
            <div class="table-scroll">
                <table class="table-x">
                    <thead>
                    <tr>
                        <th>Document</th>
                        <th class="t-center">Vigència</th>
                        <th class="t-center">Arxiu</th>
                        <th class="t-center">Validat</th>
                        <th>Caducitat</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doc, stat : *{documents}" class="row-spine" th:classappend="${doc.exempt ? 'row--disabled' : (doc.status == 'EXPIRED' ? 'row--expired' : (doc.status == 'EXPIRING_SOON' ? 'row--warn' : (doc.status == 'OK' ? 'row--ok' : '')))}">
                        <input type="hidden" th:field="*{documents[__${stat.index}__].id}" />
                        <td><span class="cell-name" th:style="${doc.exempt ? 'text-decoration: line-through; color: #999;' : ''}" th:text="${doc.documentType.name}"></span></td>
                        <td class="t-center">
                            <span th:if="${doc.status == 'EXEMPT'}" class="pill pill--neutral">No aplica</span>
                            <span th:if="${doc.status == 'OK'}" class="pill pill--ok">En vigor</span>
                            <span th:if="${doc.status == 'PENDING'}" class="pill pill--neutral">Pendent</span>
                            <span th:if="${doc.status == 'EXPIRED'}" class="pill pill--danger">Caducat</span>
                            <span th:if="${doc.status == 'EXPIRING_SOON'}" class="pill pill--warn">Caduca aviat</span>
                        </td>
                        <td class="t-center">
                            <a th:href="@{/document/{id}/toggle-exempt(id=${doc.id})}" class="btn btn--sm" th:classappend="${doc.exempt ? 'btn--ink' : 'btn--quiet'}" th:text="${doc.exempt ? 'Activa' : 'Ignora'}"></a>
                            <a th:if="${doc.fileName == null and !doc.exempt}" th:href="@{/document/{id}/upload(id=${doc.id})}" class="btn btn--line btn--sm">Puja arxiu</a>
                            <a th:if="${doc.fileName != null and !doc.exempt}" th:href="@{/document/{id}/download(id=${doc.id})}" class="btn btn--cobalt btn--sm">Obre arxiu</a>
                        </td>
                        <td class="t-center">
                            <input th:if="${!doc.exempt}" class="form-check-input" type="checkbox" th:field="*{documents[__${stat.index}__].received}" />
                        </td>
                        <td>
                            <input th:if="${doc.documentType.expires and !doc.exempt}" class="form-control form-control-sm" type="date" th:field="*{documents[__${stat.index}__].expirationDate}" />
                            <span th:unless="${doc.documentType.expires}" th:if="${!doc.exempt}" class="cell-sub">Sense caducitat</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="savebar">
            <button type="submit" class="btn btn--ink btn--lg">Desa les validacions</button>
        </div>
    </form>
</main>
</body>
</html>
