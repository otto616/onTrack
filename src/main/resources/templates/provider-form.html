<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestió de proveïdor · Gestor Documental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" th:href="@{/}">
      <span class="brand__mark">GV</span>
      <span class="brand__text">
                <strong>Gestor</strong>
                <span>Documental</span>
            </span>
    </a>
    <nav class="appnav">
      <a th:href="@{/}" class="appnav__link">Proveïdors</a>
      <a th:href="@{/projects}" class="appnav__link">Obres</a>
      <a th:href="@{/catalog}" class="appnav__link">Catàleg</a>
    </nav>
  </div>
</header>

<main class="shell shell--narrow">

  <a th:href="@{/}" class="backlink">&larr; Tots els proveïdors</a>

  <div class="pagehead">
    <div>
      <span class="eyebrow" th:text="${provider.id == null ? 'Alta' : 'Edicio'}"></span>
      <h1 class="pagehead__title" th:text="${provider.id == null ? 'Nou proveïdor' : 'Edita proveïdor'}"></h1>
      <p class="pagehead__sub" th:text="${provider.id == null ? 'En crear el registre, es generara la documentacio segons la tipologia.' : 'Modifica les dades basiques de la teva empresa.'}"></p>
    </div>
  </div>

  <div class="panel">
    <div class="panel__head">
      <div class="panel__title">Dades de l'empresa</div>
      <span class="panel__note">Tots els camps són obligatoris</span>
    </div>

    <form th:action="${provider.id == null ? '/provider/new' : '/provider/' + provider.id + '/edit'}" th:object="${provider}" method="post" class="panel__body">

      <div class="field">
        <label class="field__label" for="providerName">Nom de l'empresa</label>
        <input type="text" id="providerName" class="form-control" th:field="*{name}"
               placeholder="Raó social completa" required />
      </div>

      <div class="field">
        <label class="field__label" for="providerTaxId">NIF / CIF</label>
        <input type="text" id="providerTaxId" class="form-control" th:field="*{taxId}"
               placeholder="B12345678" required />
        <p class="field__hint">S'utilitza per cercar el proveïdor des del directori.</p>
      </div>

      <div class="field">
        <label class="field__label" for="providerType">Tipologia</label>
        <select id="providerType" class="form-select" th:field="*{providerType}" required>
          <option value="" disabled selected>Selecciona una tipologia</option>
          <option th:each="type : ${providerTypes}"
                  th:value="${type}"
                  th:text="${type.description}"></option>
        </select>
        <p class="field__hint">Determina quins documents li seran exigits.</p>
      </div>

      <div class="form-actions">
        <a th:href="@{/}" class="btn btn--quiet">Cancel·la</a>
        <button type="submit" class="btn btn--ink" th:text="${provider.id == null ? 'Crea el proveïdor' : 'Desa els canvis'}"></button>
      </div>

    </form>
  </div>

</main>

<footer class="sitefoot">
  <div class="sitefoot__inner">
    <span>Gestor documental intern</span>
  </div>
</footer>

</body>
</html>
