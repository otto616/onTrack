<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edició d'Obra · Gestor Documental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="appbar">
    <div class="appbar__inner">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark">GV</span>
            <span class="brand__text">
                <strong>Gestor</strong>
                <span>Documental</span>
            </span>
        </a>
        <nav class="appnav">
            <a th:href="@{/}" class="appnav__link">Proveïdors</a>
            <a th:href="@{/projects}" class="appnav__link is-active">Obres</a>
            <a th:href="@{/catalog}" class="appnav__link">Catàleg</a>
        </nav>
    </div>
</header>

<main class="shell shell--narrow">

    <a th:href="@{/projects/catalog}" class="backlink">&larr; Torna al llistat d'obres</a>

    <div class="pagehead">
        <div>
            <span class="eyebrow" th:text="${project.id == null ? 'Nova Obra' : 'Modificació'}"></span>
            <h1 class="pagehead__title" th:text="${project.id == null ? 'Crea una Obra' : 'Canvia el nom de l''Obra'}"></h1>
            <p class="pagehead__sub">Si canvies el nom, aquest s'actualitzarà a tots els llocs on l'obra estigui assignada.</p>
        </div>
    </div>

    <div class="panel">
        <div class="panel__head">
            <div class="panel__title">Detalls del projecte</div>
            <span class="panel__note">Tots els camps són obligatoris</span>
        </div>

        <form th:action="${project.id == null ? '/projects/catalog/new' : '/projects/catalog/' + project.id + '/edit'}" th:object="${project}" method="post" class="panel__body">

            <div class="field">
                <label class="field__label" for="projectName">Nom de la promoció, obra o zona</label>
                <input type="text" id="projectName" class="form-control" th:field="*{name}" placeholder="Ex: Ampliació Sud, Sector A..." required />
            </div>

            <div class="form-actions">
                <a th:href="@{/projects/catalog}" class="btn btn--quiet">Cancel·la</a>
                <button type="submit" class="btn btn--ink" th:text="${project.id == null ? 'Registra l''Obra' : 'Desa els canvis'}"></button>
            </div>

        </form>
    </div>

</main>

<footer class="sitefoot">
    <div class="sitefoot__inner">
        <span>Gestor documental intern</span>
    </div>
</footer>

</body>
</html>
